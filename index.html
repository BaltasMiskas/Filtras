            { weather: "ruduo_sausas", occasion: "kasdienai", type: "virsutiniai", tag: "Stilius", title: "Rudeniniai puspalčiai", desc: "Stilingi ir patogūs trumpi paltai bei puspalčiai kasdieniams miesto deriniams.", url: "/pagrindinis-meniu/lietuvos-dizaineriu-drabuziai-ir-aksesuarai-moterims/paltai-striukes-lietpalciai/paltaistriukes" },

            { weather: "ruduo_slapias", occasion: "darbui", type: "virsutiniai", tag: "Elegantiška apsauga", title: "Klasikiniai lietpalčiai biurui", desc: "Elegantiški, neperšlampami lietpalčiai, puikiai tinkantys užsivilkti ant darbinio kostiumo.", url: "/pagrindinis-meniu/lietuvos-dizaineriu-drabuziai-ir-aksesuarai-moterims/paltai-striukes-lietpalciai/lietpalciai" },
            { weather: "ruduo_slapias", occasion: "laisvalaikiui", type: "audinys", tag: "Laisvė", title: "Džemperiai ir laisvalaikio kelnės", desc: "Minkšti medvilnės komplektai po neperšlampama striuke patogiems pasivaikščiojimams.", url: "/pagrindinis-meniu/lietuvos-dizaineriu-drabuziai-ir-aksesuarai-moterims/megzti-drabuziai/dzemperiai-2" },
            { weather: "ruduo_slapias", occasion: "sventei", type: "aksesuarai", tag: "Aroma", title: "Nišiniai kvepalai", desc: "Gilesni, šilti medžio ir prieskonių aromatai, skambantys ypač prabangiai drėgną rudenį.", url: "/pagrindinis-meniu/lietuvos-dizaineriu-drabuziai-ir-aksesuarai-moterims/nisiniai-kvepalai" }
        ];

        var container = document.getElementById('bm-squares-main-container');
        if (!container) return;

        document.getElementById('bm-filter-submit').addEventListener('click', function() {
            var weather = document.getElementById('bm-weather-select').value;
            var occasion = document.getElementById('bm-occasion-select').value;
            var type = document.getElementById('bm-type-select').value;

            var wrapper = document.getElementById('bm-recommendations-wrapper');
            var headline = document.getElementById('bm-res-headline');
            if (!wrapper || !headline) return;
            
            wrapper.innerHTML = ''; 

            var filtered = dataset.filter(function(item) {
                return item.weather === weather && item.occasion === occasion && (type === 'visi' || item.type === type);
            });

            if (filtered.length === 0) {
                headline.innerText = "Rezultatai";
                wrapper.innerHTML = '<p class="bm-description">Šiuo metu pagal pasirinktus kriterijus konkrečių rekomendacijų neturime. Pabandykite pakeisti 3 žingsnio pasirinkimą į „Rodyti visą asortimentą“.</p>';
            } else {
                headline.innerText = "Rekomenduojami pasirinkimai";
                
                var isDesktop = window.innerWidth > 768;
                var itemsToShow = isDesktop ? filtered.slice(0, 2) : filtered.slice(0, 1);

                itemsToShow.forEach(function(item) {
                    var card = document.createElement('div');
                    card.className = 'bm-output-card';
                    card.innerHTML = `<div class="bm-card-tag">\({item.tag}</div><h4 class="bm-card-title">\){item.title}</h4><p class="bm-card-desc">\({item.desc}</p><a href="\){baseUrl}${item.url}" target="_blank" class="bm-card-link">Atrasti asortimentą</a>`;
                    wrapper.appendChild(card);
                });
            }

            container.classList.add('show-results');
        });

        document.getElementById('bm-back-to-filters').addEventListener('click', function() {
            container.classList.remove('show-results');
        });
    })();
</script>
